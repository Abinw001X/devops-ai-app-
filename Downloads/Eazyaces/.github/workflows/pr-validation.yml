name: Pull request validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: imranismail/setup-kustomize@v2
      - run: npm ci
      - run: npm run lint --workspace=apps/frontend
      - run: npm test --if-present
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Render Kubernetes overlays without a cluster
        run: |
          kustomize build infra/k8s/overlays/dev > /dev/null
          kustomize build infra/k8s/overlays/staging > /dev/null
          kustomize build infra/k8s/overlays/prod > /dev/null
